<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agenttasker</title>
<style>
:root {
  --bg: #0f1115; --panel: #161a21; --panel2: #1c212b; --line: #2a303c;
  --fg: #e8eaf0; --dim: #8a93a5; --accent: #4f8cff;
  --deferred: #8a8a97; --backlog: #22d3ee; --todo: #e5e7eb;
  --in_progress: #fbbf24; --in_review: #d946ef; --done: #34d399;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
       display: flex; flex-direction: column; overflow: hidden; }
#main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
a { color: var(--accent); }
button { font: inherit; background: var(--panel2); color: var(--fg);
         border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px;
         cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { border-color: #b91c1c; color: #f87171; }
input, select, textarea { font: inherit; background: var(--panel2); color: var(--fg);
       border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; }
textarea { resize: vertical; min-height: 140px; }
.topbar { display: flex; gap: 10px; align-items: center; padding: 10px 14px;
          border-bottom: 1px solid var(--line); flex: 0 0 auto;
          background: var(--bg); z-index: 5; flex-wrap: wrap; }
.topbar h1 { font-size: 15px; margin: 0 6px 0 0; color: var(--dim); font-weight: 600; }
.topbar .spacer { flex: 1; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; }
.seg button.on { background: var(--accent); color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
.dot.off { background: var(--dim); }

/* board — the page never scrolls; each column scrolls under its pinned header */
.board { display: flex; gap: 10px; padding: 12px; flex: 1 1 auto; min-height: 0;
         overflow-x: auto; align-items: stretch; }
.col { flex: 1 1 0; min-width: 230px; background: var(--panel);
       border: 1px solid var(--line); border-radius: 8px;
       overflow-y: auto; overscroll-behavior: contain; }
.col > h2 { margin: 0; padding: 8px 10px; font-size: 12px; letter-spacing: .06em;
            text-transform: uppercase; border-bottom: 2px solid var(--line);
            position: sticky; top: 0; background: var(--panel); z-index: 1; }
.col > h2 .n { color: var(--dim); }
.card { margin: 8px; padding: 8px 10px; background: var(--panel2); border-radius: 6px;
        border-left: 3px solid var(--sc, var(--dim)); cursor: pointer; }
.card:hover { outline: 1px solid var(--accent); }
.card .t { font-weight: 600; word-break: break-word; }
.card .m { color: var(--dim); font-size: 12px; margin-top: 3px; }
.card .m .blocked { color: #f87171; }
.card .m .ready { color: var(--done); }
.card .d { color: var(--dim); font-size: 12px; margin-top: 4px;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
           overflow: hidden; }

/* list — scrolls in its own pane under a pinned header row */
.listwrap { padding: 12px; flex: 1 1 auto; min-height: 0; overflow: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; color: var(--dim); font-size: 12px; text-transform: uppercase;
     letter-spacing: .05em; border-bottom: 1px solid var(--line); padding: 6px 8px;
     position: sticky; top: 0; background: var(--bg); z-index: 1; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
tr.row { cursor: pointer; }

/* expanded category view */
.expwrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.exphead { position: sticky; top: 0; z-index: 2; display: flex; gap: 14px;
           align-items: center; padding: 10px 14px; background: var(--bg);
           border-bottom: 1px solid var(--line); }
.exptitle { margin: 0; font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
            border-left: 4px solid var(--sc, var(--dim)); padding-left: 10px; }
.exptitle .n { color: var(--dim); }
.expgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
           gap: 14px; padding: 14px; align-items: start; }
.bigcard { background: var(--panel); border: 1px solid var(--line);
           border-left: 4px solid var(--sc, var(--dim)); border-radius: 10px;
           padding: 14px 16px; cursor: pointer;
           height: 280px; overflow: hidden; display: flex; flex-direction: column; }
.bigcard:hover { outline: 1px solid var(--accent); }
.bigcard .bt { font-size: 15px; font-weight: 700; word-break: break-word; }
.bigcard .m { color: var(--dim); font-size: 12px; margin: 6px 0 2px; }
.bigcard .sec { margin-top: 10px; font-size: 13px; flex: 1 1 0; min-height: 0; overflow: hidden; }
.bigcard .clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
                  overflow: hidden; white-space: pre-wrap; }
.bigcard .lab { display: block; color: var(--dim); font-size: 10px;
                text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
.bigcard .deplink { color: var(--accent); text-decoration: none; margin-right: 4px; }
.bigcard .foot { display: flex; gap: 14px; align-items: baseline; margin-top: auto;
                 font-size: 12px; color: var(--dim); flex-wrap: wrap;
                 background: var(--panel); padding: 10px 0 0; border-top: 1px solid var(--line); }
tr.done td { color: var(--dim); }
.pri0 { color: #f87171; font-weight: 700; } .pri1 { color: #fbbf24; }
.pri3 { color: var(--dim); }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
           align-items: flex-start; justify-content: center; padding: 40px 16px;
           overflow-y: auto; z-index: 10; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
         width: 80vw; max-width: 100%; max-height: 92vh; padding: 0;
         display: flex; flex-direction: column; }
.modal .head { display: flex; gap: 8px; align-items: center; padding: 12px 16px;
               border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: 0 0 auto; }
.modal .head .ref { color: var(--dim); }
.modal .head .spacer { flex: 1; }
.modal .body { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px;
               flex: 1 1 auto; min-height: 0; overflow: auto; }
.modal .foot { display: flex; gap: 8px; padding: 12px 16px;
               border-top: 1px solid var(--line); flex-wrap: wrap; flex: 0 0 auto; }
.modal .foot .spacer { flex: 1; }
.static { padding: 6px 0; white-space: pre-wrap; word-break: break-word; }
.fieldhead { display: flex; align-items: baseline; gap: 6px; }
.fieldhead label { color: var(--dim); font-size: 11px; text-transform: uppercase;
                   letter-spacing: .08em; flex: 0 0 auto; }
button.mini { padding: 1px 8px; font-size: 11px; }
.trio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
        flex: 1 1 auto; min-height: 220px; }
.ev { padding: 4px 0; border-bottom: 1px solid var(--line); }
.ev .evts { display: block; color: var(--dim); font-size: 11px;
             font-variant-numeric: tabular-nums; }
.ev .evtext { display: block; font-size: 13px; white-space: pre-wrap;
              word-break: break-word; margin-top: 2px; }
.pane { display: flex; flex-direction: column; min-height: 0;
        border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.pane > .fieldhead { flex: 0 0 auto; }
.pane .content { flex: 1 1 auto; min-height: 0; overflow: auto;
                 white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.pane textarea { width: 100%; height: 100%; min-height: 0; flex: 1 1 auto; resize: none; }
.topfields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.topfields .full { grid-column: 1 / -1; }
.att { display: grid; grid-template-columns: 1fr auto 26px; gap: 10px;
       align-items: center; padding: 4px 0; }
.att a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .sz { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
           white-space: nowrap; text-align: right; }
.att button { width: 26px; padding: 1px 0; text-align: center; }
.att form { display: inline; }
.note { color: var(--dim); font-size: 12px; }
.err { color: #f87171; }
/* project picker */
.pick { display: flex; flex-direction: column; gap: 8px; max-width: 420px;
        margin: 10vh auto; padding: 20px; background: var(--panel);
        border: 1px solid var(--line); border-radius: 10px; }
.pick h1 { font-size: 16px; margin: 0 0 6px; }
.pick button { text-align: left; padding: 10px; }
</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none">
  <h1>agenttasker</h1>
  <select id="proj" style="width:auto"></select>
  <div class="seg">
    <button id="vBoard">Board</button>
    <button id="vList">List</button>
    <button id="vAgents">Agents</button>
  </div>
  <button class="primary" id="newTask">+ New task</button>
  <input id="q" placeholder="search title/description…" style="width: 220px">
  <div class="spacer"></div>
  <span class="note" id="msg"></span>
  <div class="dot" id="live" title="auto-refresh"></div>
</div>
<div id="main"></div>

<script>
"use strict";
let CFG = null, TASKS = [], PROJECT = null, VIEW = localStorage.atx_view || "board";
let modalOpen = false, lastHash = "", EXPANDED = null, QUERY = "";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SC = (st) => `var(--${st})`;

async function api(path, opts = {}) {
  if (opts.body) { opts.headers = {"Content-Type": "application/json"}; opts.body = JSON.stringify(opts.body); }
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}

function visibleTasks() {
  if (!QUERY) return TASKS;
  if (QUERY.startsWith("#")) {  // "#12" — direct task id lookup
    const id = parseInt(QUERY.slice(1), 10);
    return Number.isInteger(id) ? TASKS.filter(t => t.id === id) : [];
  }
  const q = QUERY.toLowerCase();
  return TASKS.filter(t =>
    (t.name || "").toLowerCase().includes(q) ||
    (t.description || "").toLowerCase().includes(q));
}
function note(text, isErr) {
  const el = $("#msg"); el.textContent = text || "";
  el.className = isErr ? "err" : "note";
  if (text) setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 4000);
}

const statusLabel = (s) => ({deferred:"Deferred", backlog:"Backlog", todo:"To Do",
  in_progress:"In Progress", in_review:"In Review", done:"Done"}[s] || s);
const priLabel = (p) => "P" + p;
function human(n) { for (const u of ["B","KB","MB","GB"]) { if (n < 1024 || u === "GB")
  return u === "B" ? `${n} ${u}` : `${n.toFixed(1)} ${u}`; n /= 1024; } }

function metaLine(t) {
  const bits = [];
  if (t.story_progress) bits.push(`<b>${t.story_progress}</b>`);
  if (t.priority !== CFG.default_priority) bits.push(`<b class="pri${t.priority}">${priLabel(t.priority)}</b>`);
  if (t.blocked) bits.push(`<span class="blocked">blocked</span>`);
  else if (t.ready) bits.push(`<span class="ready">ready</span>`);
  return bits.join(" · ");
}
function blockedBy(t) {
  const bits = t.blocked_by.slice(0,2).map(i => "#"+i);
  if (t.blockers?.length) bits.push(`ext:${t.blockers.length}`);
  return bits.join(",") || "—";
}

/* ---------- views ---------- */
function render() {
  const main = $("#main");
  document.documentElement.style.setProperty("--proj", PROJECT);
  if (VIEW === "list") renderList(main);
  else if (VIEW === "agents") renderAgents(main);
  else if (EXPANDED) renderExpanded(main, EXPANDED);
  else renderBoard(main);
  $("#vBoard").classList.toggle("on", VIEW === "board");
  $("#vList").classList.toggle("on", VIEW === "list");
  $("#vAgents").classList.toggle("on", VIEW === "agents");
}
function renderBoard(main) {
  main.innerHTML = `<div class="board">` + CFG.statuses.map(st => {
    const ts = visibleTasks().filter(t => t.status === st);
    return `<div class="col" data-status="${st}"><h2>${statusLabel(st)} <span class="n">(${ts.length})</span></h2>` +
      ts.map(t => card(t)).join("") + `</div>`;
  }).join("") + `</div>`;
}
function card(t) {
  const body = (t.description || t.evidence || "").trim();
  return `<div class="card" style="--sc:${SC(t.status)}" data-id="${t.id}">
    <div class="t">#${t.id} ${esc(t.name)}</div>
    <div class="m">${metaLine(t)}</div>
    ${body ? `<div class="d">${esc(body)}</div>` : ""}</div>`;
}
function renderList(main) {
  const order = {}; CFG.list_order.forEach((s, i) => order[s] = i);
  const rows = [...visibleTasks()].sort((a, b) => order[a.status] - order[b.status] || a.priority - b.priority || a.id - b.id);
  main.innerHTML = `<div class="listwrap"><table>
    <tr><th>ID</th><th>Title</th><th>Status</th><th>Pri</th><th>Type</th><th>Blocked by</th><th>Owner</th><th>Created</th></tr>
    ${rows.map(t => `<tr class="row ${t.status === "done" ? "done" : ""}" data-id="${t.id}">
      <td>${t.id}</td><td>${esc(t.name)}</td><td>${statusLabel(t.status)}</td>
      <td class="pri${t.priority}">${priLabel(t.priority)}</td><td>${esc(t.type)}</td>
      <td>${esc(blockedBy(t))}</td><td>${t.owner ? "@" + esc(t.owner) : "—"}</td>
      <td>${esc((t.created_at || "").slice(0, 10))}</td></tr>`).join("")}
  </table></div>`;
}

function renderAgents(main) {
  const rows = [...visibleTasks()].filter(t => t.owner)
    .sort((a, b) => a.owner.localeCompare(b.owner) || a.priority - b.priority || a.id - b.id);
  main.innerHTML = `<div class="listwrap"><table>
    <tr><th>ID</th><th>Owner</th><th>Title</th><th>Status</th><th>Pri</th><th>Type</th><th>Claimed</th><th>Spent</th><th>Updated</th></tr>
    ${rows.map(t => `<tr class="row" data-id="${t.id}">
      <td>${t.id}</td><td>@${esc(t.owner)}</td><td>${esc(t.name)}</td>
      <td>${statusLabel(t.status)}</td>
      <td class="pri${t.priority}">${priLabel(t.priority)}</td><td>${esc(t.type)}</td>
      <td>${esc((t.claimed_at || "").slice(0, 16).replace("T", " "))}</td>
      <td>${t.active_hours != null ? t.active_hours.toFixed(1) + "h" : "—"}</td>
      <td>${esc((t.last_activity || "").slice(0, 16).replace("T", " "))}</td></tr>`).join("")
      || `<tr><td colspan="9" class="note">no active claims</td></tr>`}
  </table></div>`;
}

/* ---------- expanded category view ---------- */
function bigCard(t) {
  const desc = (t.description || "").trim();
  const ev = (t.evidence || "").trim();
  const deps = t.depends_on?.length
    ? t.depends_on.map(i => `<a href="#" data-id="${i}" class="deplink">#${i}</a>`).join(" ") : "";
  return `<div class="bigcard" style="--sc:${SC(t.status)}" data-id="${t.id}">
    <div class="bt">#${t.id} · ${esc(t.name)}</div>
    <div class="m">${metaLine(t)}</div>
    ${desc ? `<div class="sec"><span class="lab">description</span><div class="clamp">${esc(desc)}</div></div>` : ""}
    ${ev ? `<div class="sec"><span class="lab">evidence</span><div class="clamp">${esc(ev)}</div></div>` : ""}
    <div class="foot">
      ${deps ? `<span class="lab">deps</span> ${deps}` : ""}
      ${t.attachments?.length ? `<span class="att">📎 ${t.attachments.length}</span>` : ""}
      <span class="when">${esc((t.created_at || "").slice(0, 10))}</span>
    </div>
  </div>`;
}
function renderExpanded(main, status) {
  const ts = visibleTasks().filter(t => t.status === status);
  main.innerHTML = `<div class="expwrap">
    <div class="exphead">
      <button data-act="back">← Back to board</button>
      <h2 class="exptitle" style="--sc:${SC(status)}">${statusLabel(status)}
        <span class="n">(${ts.length})</span></h2>
    </div>
    <div class="expgrid">${ts.map(bigCard).join("") || `<span class="note">(no tasks)</span>`}</div>
  </div>`;
}

/* ---------- modal ---------- */
function modal(title, bodyHtml, footHtml) {
  close();
  modalOpen = true;
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "overlay";
  ov.innerHTML = `<div class="modal">
    <div class="head">${title}<div class="spacer"></div></div>
    <div class="body">${bodyHtml}</div>
    <div class="foot">${footHtml}</div></div>`;
  ov.addEventListener("mousedown", (e) => { if (e.target === ov) close(); });
  document.body.appendChild(ov);
}
function close() { document.getElementById("overlay")?.remove(); modalOpen = false; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modalOpen) close(); });

let EDIT = new Set();

function fld(key, label, value, inputHtml, full) {
  const editing = EDIT.has(key);
  return `<div class="${full ? "full " : ""}fieldhead-wrap">
    <div class="fieldhead"><label>${label}</label>
      <button class="mini" data-act="${editing ? "editdone" : "edit"}" data-k="${key}">${editing ? "done" : "edit"}</button>
    </div>
    ${editing ? inputHtml : `<div class="static">${esc(value) || '<span class="note">—</span>'}</div>`}
  </div>`;
}

function openTask(id) {
  const t = TASKS.find(x => x.id === id); if (!t) return;
  const opt = (vals, cur, labels) => vals.map(v =>
    `<option value="${v}" ${v == cur ? "selected" : ""}>${labels ? labels(v) : v}</option>`).join("");
  const ownerBits = t.owner
    ? `@${esc(t.owner)}${t.claim_age_hours != null ? ` · ${t.claim_age_hours.toFixed(1)}h` : ""}`
    : `unclaimed`;

  modal(
    `<span class="ref">${esc(t.project)}-${t.id}</span>
     <button data-act="prev" title="move back">◀</button>
     <button data-act="next" title="move forward">▶</button>`,
    `
    <div class="topfields">
      ${fld("name", "Title", t.name, `<input id="f_name" value="${esc(t.name)}">`, true)}
      <div><div class="fieldhead"><label>Status</label></div>
        <select id="f_status">${opt(CFG.statuses, t.status, statusLabel)}</select></div>
      <div><div class="fieldhead"><label>Priority</label></div>
        <select id="f_priority">${opt(CFG.priorities.map((_, i) => i), t.priority, priLabel)}</select></div>
      <div><div class="fieldhead"><label>Type</label></div>
        <select id="f_type">${opt(CFG.types, t.type)}</select></div>
      <div><div class="fieldhead"><label>Owner</label></div>
        <div class="static">${ownerBits}</div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="mini" data-act="claim">claim</button>
          <button class="mini" data-act="release">release</button></div></div>
      ${fld("tags", "Tags", t.tags.join(", "), `<input id="f_tags" value="${esc(t.tags.join(", "))}" placeholder="comma-separated">`)}
      ${fld("depends_on", "Depends on", t.depends_on.map(i => "#" + i).join(", "),
            `<input id="f_deps" value="${t.depends_on.map(i => "#" + i).join(", ")}" placeholder="#1, #4">`)}
      ${fld("affects", "Affects", t.affects.map(i => "#" + i).join(", "),
            `<input id="f_affects" value="${t.affects.map(i => "#" + i).join(", ")}" placeholder="#2">`)}
      ${fld("blockers", "Blockers", t.blockers.join(", "),
            `<input id="f_blockers" value="${esc(t.blockers.join(", "))}" placeholder="comma-separated">`)}
    </div>
    <div class="trio">
      ${(t.children?.length) ? `
      <div class="pane">
        <div class="fieldhead"><label>Sub-tasks (${t.story_progress} done)</label></div>
        <div class="content">${t.children.map(c =>
          `<div class="ev"><span class="evkind">#${c.id}</span>` +
          `<span style="flex:1;${c.status === "done" ? "color:var(--dim)" : ""}">${esc(c.name)}</span>` +
          `<span class="evts">${statusLabel(c.status)}</span></div>`).join("")}</div>
      </div>` : `
      <div class="pane">
        <div class="fieldhead"><label>Description</label>
          <button class="mini" data-act="${EDIT.has("description") ? "editdone" : "edit"}" data-k="description">${EDIT.has("description") ? "done" : "edit"}</button></div>
        ${EDIT.has("description")
          ? `<textarea id="f_desc">${esc(t.description)}</textarea>`
          : `<div class="content">${esc(t.description) || '<span class="note">(none)</span>'}</div>`}
      </div>`}
      <div class="pane">
        <div class="fieldhead"><label>Evidence</label></div>
        <div class="content">${(t.evidence_rows || []).map(e => `
          <div class="ev">
            <span class="evts">${esc((e.ts || "").slice(0, 19).replace("T", " "))}</span>
            <span class="evtext">${esc(e.text)}</span>
          </div>`).join("") || '<span class="note">(none)</span>'}</div>
        <div style="display:flex;gap:6px;margin-top:6px;flex:0 0 auto">
          <input id="f_append" placeholder="append a line…">
          <button class="mini" data-act="append">Append</button></div>
      </div>
      <div class="colstack">
        <div class="pane" style="flex: 0 0 45%;">
          <div class="fieldhead"><label>Attachments</label></div>
          <div class="content">${t.attachments.map(a => attRow(t, a)).join("") || '<span class="note">(none)</span>'}</div>
          <div style="display:flex;gap:6px;margin-top:6px;align-items:center;flex:0 0 auto">
            <input type="file" id="f_file">
            <button class="mini" data-act="upload">Upload</button></div>
        </div>
        <div class="pane" style="flex: 1 1 auto;">
          <div class="fieldhead"><label>Event log</label></div>
          <div class="content">${(t.events || []).map(e =>
            `<div class="ev"><span class="evts">${esc((e.ts || "").slice(0, 19).replace("T", " "))}</span>` +
            `<span class="evkind">${esc(e.kind)}</span> <span>${esc(e.detail)}</span></div>`).join("")
            || '<span class="note">(no events yet)</span>'}</div>
        </div>
      </div>
    </div>`,
    `<button class="primary" data-act="save">Save</button>
     <button data-act="close">Close</button>
     <div class="spacer"></div>
     <button class="danger" data-act="delete">Delete task</button>`);

  const base = `/api/tasks/${encodeURIComponent(t.project)}/${t.id}`;
  $("#overlay .modal").addEventListener("click", async (e) => {
    const act = e.target.dataset?.act;
    if (!act) return;
    try {
      if (act === "close") close();
      if (act === "edit") { EDIT.add(e.target.dataset.k); openTask(id); return; }
      if (act === "editdone") { EDIT.delete(e.target.dataset.k); openTask(id); return; }
      if (act === "save") { await save(t); }
      if (act === "prev" || act === "next") {
        const i = CFG.statuses.indexOf(t.status);
        const to = CFG.statuses[Math.min(CFG.statuses.length - 1, Math.max(0, i + (act === "next" ? 1 : -1)))];
        if (to !== t.status) { await api(base, {method: "PATCH", body: {status: to}}); await reload(); EDIT.clear(); openTask(id); }
      }
      if (act === "claim") {
        const owner = prompt("Claim as (owner name):"); if (!owner) return;
        await api(base, {method: "PATCH", body: {claim: {owner}}}); await reload(); EDIT.clear(); openTask(id);
      }
      if (act === "release") {
        await api(base, {method: "PATCH", body: {release: {owner: t.owner}}}); await reload(); EDIT.clear(); openTask(id);
      }
      if (act === "append") {
        const text = $("#f_append").value.trim(); if (!text) return;
        await api(base, {method: "PATCH", body: {append_evidence: text}});
        await reload(); openTask(id); note("evidence appended");
      }
      if (act === "edit_ev") {
        const entry = t.evidence_rows.find(x => x.id === +e.target.dataset.id);
        const next = prompt("Edit evidence entry:", entry?.text || "");
        if (next != null && next.trim()) {
          await api(base, {method: "PATCH", body: {edit_evidence: {id: +e.target.dataset.id, text: next}}});
          await reload(); openTask(id);
        }
      }
      if (act === "del_ev") {
        await api(base, {method: "PATCH", body: {delete_evidence: +e.target.dataset.id}});
        await reload(); openTask(id); note("entry removed");
      }
      if (act === "upload") {
        const f = $("#f_file").files[0]; if (!f) return;
        const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.readAsDataURL(f); });
        await api(`${base}/attachments`, {method: "POST", body: {filename: f.name, content_b64: b64}});
        await reload(); openTask(id); note("uploaded");
      }
      if (act === "detach") {
        const attId = e.target.dataset.id;
        await api(`${base}/attachments/${attId}`, {method: "DELETE"});
        await reload(); openTask(id); note("detached");
      }
      if (act === "delete") {
        if (!confirm(`Delete ${t.project}-${t.id} "${t.name}"?`)) return;
        await api(base, {method: "DELETE"}); close(); await reload(); note("deleted");
      }
    } catch (err) { note(err.message, true); }
  });
}
function attRow(t, a) {
  const href = `/file/${encodeURIComponent(t.project)}/${t.id}/${a.id}/${encodeURIComponent(a.filename)}`;
  return `<div class="att"><a href="${href}" target="_blank" rel="noopener">${esc(a.filename)}</a>
    <span class="sz">${human(a.size)} · ${a.sha256.slice(0, 8)}…</span>
    <button data-act="detach" data-id="${a.id}" title="remove">✕</button></div>`;
}
async function save(t) {
  // collect only what's currently editable; other fields pass through unchanged
  const val = (sel) => $(sel) ? $(sel).value : null;
  const body = {};
  const name = val("#f_name"); if (name !== null) body.name = name;
  body.status = $("#f_status").value;
  body.priority = +$("#f_priority").value;
  body.type = $("#f_type").value;
  const tags = val("#f_tags"); if (tags !== null) body.tags = tags.split(",").map(s => s.trim()).filter(Boolean);
  const desc = val("#f_desc"); if (desc !== null) body.description = desc;
  const blockers = val("#f_blockers"); if (blockers !== null)
    body.blockers = blockers.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
  const deps = val("#f_deps"); if (deps !== null) body.depends_on = deps.split(",").map(s => s.trim()).filter(Boolean);
  const aff = val("#f_affects"); if (aff !== null) body.affects = aff.split(",").map(s => s.trim()).filter(Boolean);
  await api(`/api/tasks/${encodeURIComponent(t.project)}/${t.id}`, {method: "PATCH", body});
  await reload(); note("saved"); EDIT.clear(); close();
}

/* ---------- new task ---------- */
function openNew() {
  const opt = (vals, cur, labels) => vals.map(v =>
    `<option value="${v}" ${v == cur ? "selected" : ""}>${labels ? labels(v) : v}</option>`).join("");
  modal(`<b>New task</b> <span class="ref">${esc(PROJECT)}</span>`,
    `<div class="frow"><label>Title</label><input id="n_name" placeholder="what needs to happen"></div>
     <div class="grid3">
      <div><label class="note">Status</label><select id="n_status">${opt(CFG.statuses, "todo", statusLabel)}</select></div>
      <div><label class="note">Priority</label><select id="n_priority">${opt(CFG.priorities.map((_,i)=>i), CFG.default_priority, priLabel)}</select></div>
      <div><label class="note">Type</label><select id="n_type">${opt(CFG.types, CFG.default_type)}</select></div></div>
     <div class="frow"><label>Description</label><textarea id="n_desc"></textarea></div>
     <div class="frow"><label>Tags</label><input id="n_tags" placeholder="comma-separated"></div>
     <div class="frow"><label>Story</label><input id="n_story" placeholder="#story id (optional)"></div>
     <div class="frow"><label>Depends on</label><input id="n_deps" placeholder="#1, #4"></div>`,
    `<button class="primary" data-act="create">Create</button>
     <button data-act="close">Cancel</button>`);
  $("#overlay .modal").addEventListener("click", async (e) => {
    if (e.target.dataset?.act !== "create") { if (e.target.dataset?.act === "close") close(); return; }
    try {
      const t = await api("/api/tasks", {method: "POST", body: {
        project: PROJECT, name: $("#n_name").value,
        status: $("#n_status").value, priority: +$("#n_priority").value, type: $("#n_type").value,
        description: $("#n_desc").value,
        tags: $("#n_tags").value.split(",").map(s => s.trim()).filter(Boolean),
        parent: $("#n_story").value.trim() || null,
        depends_on: $("#n_deps").value.split(",").map(s => s.trim()).filter(Boolean),
      }});
    } catch (err) { note(err.message, true); }
  });
  $("#n_name").focus();
}

/* ---------- project picker ---------- */
function showPicker() {
  const el = document.createElement("div");
  el.className = "pick"; el.id = "pick";
  el.innerHTML = `<h1>Select a project</h1>` +
    (CFG.projects.length ? CFG.projects.map(p =>
      `<button data-p="${esc(p.name)}">${esc(p.name)} <span class="note">(${p.total} tasks)</span></button>`).join("")
      : `<span class="note">no projects yet — create tasks with <code>atx add</code> first</span>`);
  el.addEventListener("click", (e) => {
    const p = e.target.closest("button")?.dataset.p;
    if (p) { localStorage.atx_project = p; el.remove(); setProject(p); }
  });
  document.body.appendChild(el);
}

/* ---------- boot / polling ---------- */
function setProject(p) {
  PROJECT = p;
  $("#proj").value = p;
  location.hash = "";
  reload();
}
function captureScroll() {
  const s = { cols: {}, list: 0, exp: 0 };
  document.querySelectorAll(".col").forEach(c => { s.cols[c.dataset.status] = c.scrollTop; });
  const lw = document.querySelector(".listwrap");
  if (lw) s.list = lw.scrollTop;
  const exp = document.querySelector(".expwrap");
  if (exp) s.exp = exp.scrollTop;
  return s;
}
function restoreScroll(s) {
  document.querySelectorAll(".col").forEach(c => {
    if (s.cols[c.dataset.status] != null && c.scrollTop !== s.cols[c.dataset.status])
      c.scrollTop = s.cols[c.dataset.status];
  });
  const lw = document.querySelector(".listwrap");
  if (lw && s.list && lw.scrollTop !== s.list) lw.scrollTop = s.list;
  const exp = document.querySelector(".expwrap");
  if (exp && s.exp && exp.scrollTop !== s.exp) exp.scrollTop = s.exp;
}

async function reload(keepModal) {
  if (!PROJECT) return;
  const d = await api("/api/tasks?project=" + encodeURIComponent(PROJECT));
  TASKS = d.tasks;
  const h = JSON.stringify(TASKS.map(({claim_age_hours, ...rest}) => rest));
  const changed = h !== lastHash; lastHash = h;
  if (changed) {  // re-render only when data actually changed; keep scroll positions
    const scroll = captureScroll();
    render();
    restoreScroll(scroll);
  }
  $("#live").classList.toggle("off", false);
}

async function boot() {
  CFG = await api("/api/config");
  $("#topbar").style.display = "flex";
  const sel = $("#proj");
  sel.innerHTML = CFG.projects.map(p => `<option>${esc(p.name)}</option>`).join("") +
    (CFG.projects.length ? "" : `<option value="">(no projects)</option>`);
  sel.onchange = () => { localStorage.atx_project = sel.value; setProject(sel.value); };
  const fromUrl = new URLSearchParams(location.search).get("project");
  const p = fromUrl || localStorage.atx_project ||
            (CFG.projects.some(x => x.name === CFG.default_project) ? CFG.default_project : null);
  if (p) setProject(p); else if (CFG.projects.length) showPicker();
  $("#vBoard").onclick = () => { VIEW = "board"; EXPANDED = null; localStorage.atx_view = VIEW; render(); };
  $("#vList").onclick = () => { VIEW = "list"; EXPANDED = null; localStorage.atx_view = VIEW; render(); };
  $("#vAgents").onclick = () => { VIEW = "agents"; EXPANDED = null; localStorage.atx_view = VIEW; render(); };
  $("#newTask").onclick = () => PROJECT && openNew();
  $("#main").addEventListener("click", (e) => {
    const dep = e.target.closest(".deplink");
    if (dep) { e.preventDefault(); openTask(+dep.dataset.id); return; }
    const head = e.target.closest("h2");
    if (head && VIEW === "board" && head.parentElement?.dataset?.status) {
      EXPANDED = head.parentElement.dataset.status; render(); return;
    }
    if (e.target.closest('[data-act="back"]')) { EXPANDED = null; render(); return; }
    const el = e.target.closest("[data-id]");
    if (el && !e.target.closest("button,a")) openTask(+el.dataset.id);
  });
  $("#q").addEventListener("input", (e) => { QUERY = e.target.value.trim(); render(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (document.activeElement === $("#q")) {  // Esc in search: clear it
      $("#q").value = ""; QUERY = ""; render(); $("#q").blur(); return;
    }
    if (!modalOpen && EXPANDED) { EXPANDED = null; render(); }
  });
  setInterval(async () => {
    if (!modalOpen && !document.hidden && PROJECT) { try { await reload(); } catch {} }
  }, 2000);
}
boot().catch(err => document.body.insertAdjacentHTML("afterbegin",
  `<div class="pick"><span class="err">${esc(err.message)}</span></div>`));
</script>
</body>
</html>
